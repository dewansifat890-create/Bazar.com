<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <title>Bazar.com - Premium Online Shopping in Bangladesh</title>
    <meta name="description" content="Shop the best collection of fashion, watches, tech and electronics with fast delivery and COD on Bazar.com." />
    <meta name="google-site-verification" content="8uUqvoq6Mq5Ae1FtMUxEMLEu4CcQz2gudfFCXyt3bXU" />

    <!-- Google Site Identity & Favicons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bazar.com" />
    <meta property="og:title" content="Bazar.com - Premium Online Shopping in Bangladesh" />
    <meta property="og:description" content="Shop the best collection of fashion, watches, tech and electronics with fast delivery and COD on Bazar.com." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bazar.com - Premium Online Shopping in Bangladesh" />
    <meta name="twitter:description" content="Shop the best collection of fashion, watches, tech and electronics with fast delivery and COD on Bazar.com." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Google Structured Data (JSON-LD) for Google Search Site Name & Logo -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Bazar.com",
            "alternateName": ["Bazar", "bajar.com", "bazar.com", "Bazar Online Shop"],
            "url": "https://bazarcomm.netlify.app/",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://bazarcomm.netlify.app/?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "name": "Bazar.com",
            "url": "https://bazarcomm.netlify.app/",
            "logo": "https://bazarcomm.netlify.app/logo.png"
          }
        ]
      }
    </script>
    <script>
      (function() {
        try {
          var rawFetch = window.fetch;
          var customFetch = null;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return customFetch || rawFetch;
            },
            set: function(val) {
              customFetch = val;
              console.log("bazar-safeguard: custom fetch registered");
            }
          });
        } catch(e) {
          console.warn("bazar-safeguard: failed to define fetch proxy:", e);
        }
      })();

      // Prevent pinch-zooming (multi-touch) globally
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent double-tap zooming globally
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 250) {
          // Check if target is an input/textarea so we don't block normal focus
          var tag = e.target.tagName ? e.target.tagName.toLowerCase() : '';
          if (tag !== 'input' && tag !== 'textarea') {
            e.preventDefault();
          }
        }
        lastTouchEnd = now;
      }, { passive: false });

      // Prevent mouse wheel / trackpad pinch zooming
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent iOS Safari gesture-zoom
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
